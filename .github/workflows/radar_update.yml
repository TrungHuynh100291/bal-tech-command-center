name: BAL TechRadar Daily Update (05:00 AM VN / 22:00 UTC)

on:
  schedule:
    # 22:00 UTC hang ngay = 05:00 sang gio Viet Nam (UTC+7)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bal-techradar-daily
  cancel-in-progress: true

jobs:
  radar-scan-and-summarize:
    name: Fetch 30 Trending Repos & Summarize with Gemini
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BAL TechRadar
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Google GenAI SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run github_radar.py (30 Python/TypeScript Repos + Gemini Summary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python github_radar.py --limit 30

      - name: Commit & Push Updated TechRadar Feed
        run: |
          git config user.name "BAL TechRadar Bot"
          git config user.email "techradar-bot@baoanhlam.local"
          git add data/tech_radar_latest.json data/tech_radar_report.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(techradar): Daily 22:00 UTC (05:00 VN) update"
          git push
